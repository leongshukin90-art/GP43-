<div class="prototype-note">Logic prototype · in-memory only · refresh resets</div>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div><button class="source-toggle" type="button" data-source-toggle>HTML functions</button>
<section class="source-panel" id="source-panel" aria-hidden="true" aria-label="HTML rendering function source">
  <header class="source-head"><div><strong>HTML render functions</strong><span>Click a tab to read the function that builds each screen.</span></div><div><button class="source-close" type="button" data-source-copy>Copy</button> <button class="source-close" type="button" data-source-close>Close</button></div></header>

<script>const DEMO_USERS = [
  { id: 'U1', username: 'staff01', password: '123456', name: 'Wong Ka Ming', role: 'staff', phone: '+852 9000 0001' },
  { id: 'U2', username: 'admin01', password: '123456', name: 'Lee Mei Ling', role: 'admin', phone: '+852 9000 0002' },
  { id: 'U3', username: 'cust01', password: '123456', name: 'Chan Tai Man', role: 'customer', phone: '+852 9000 0003' },
  { id: 'U4', username: 'cust02', password: '123456', name: 'Lau Mei Mei', role: 'customer', phone: '+852 9000 0004' }
];

function clone(value) {
  return JSON.parse(JSON.stringify(value));
}

function initialData() {
  return {
    users: clone(DEMO_USERS),
    packages: [
      { id: 'P1', trackingNo: 'HK-1001', recipientName: 'Chan Tai Man', customerId: 'U3', status: 'Arrived', type: 'Document', weight: 1.2, shelfId: null, pickupCode: null, arrivedAt: '06 Oct 09:10', shelvedAt: null, notifiedAt: null, pickedUpAt: null },
      { id: 'P2', trackingNo: 'HK-1002', recipientName: 'Chan Tai Man', customerId: 'U3', status: 'Shelved', type: 'Parcel', weight: 2.4, shelfId: 'S1', pickupCode: '310245', arrivedAt: '05 Oct 14:20', shelvedAt: '05 Oct 15:00', notifiedAt: null, pickedUpAt: null },
      { id: 'P3', trackingNo: 'HK-1003', recipientName: 'Chan Tai Man', customerId: 'U3', status: 'Notified', type: 'Fragile', weight: 0.8, shelfId: 'S2', pickupCode: '481920', arrivedAt: '06 Oct 08:30', shelvedAt: '06 Oct 09:00', notifiedAt: '06 Oct 09:05', pickedUpAt: null },
      { id: 'P4', trackingNo: 'HK-1004', recipientName: 'Chan Tai Man', customerId: 'U3', status: 'Exception', type: 'Parcel', weight: 3.1, shelfId: null, pickupCode: null, arrivedAt: '04 Oct 11:00', shelvedAt: null, notifiedAt: null, pickedUpAt: null, previousStatus: 'Arrived' },
      { id: 'P5', trackingNo: 'HK-2001', recipientName: 'Lau Mei Mei', customerId: 'U4', status: 'Arrived', type: 'Parcel', weight: 1.7, shelfId: null, pickupCode: null, arrivedAt: '06 Oct 10:15', shelvedAt: null, notifiedAt: null, pickedUpAt: null }
    ],
    shelves: [
      { id: 'S1', code: 'S-A-01', capacity: 3, used: 1, status: 'Active' },
      { id: 'S2', code: 'S-B-01', capacity: 2, used: 1, status: 'Active' }
    ],
    notifications: [
      { id: 'N1', userId: 'U3', packageId: 'P3', title: 'Parcel ready for pickup: HK-1003', content: 'Pickup code 481920.', createdAt: '06 Oct 09:05' }
    ],
    exceptions: [
      { id: 'E1', packageId: 'P4', type: 'Damaged', description: 'Box dented during transport.', status: 'Open', reportedBy: 'U1', createdAt: '04 Oct 12:00', resolvedAt: null }
    ],
    logs: [
      { id: 'L1', action: 'LOGIN', userId: 'U1', username: 'staff01', detail: 'User signed in.', createdAt: '06 Oct 08:00' },
      { id: 'L2', action: 'PACKAGE_SHELVED', userId: 'U1', username: 'staff01', detail: 'HK-1002 placed on S-A-01.', createdAt: '05 Oct 15:00' },
      { id: 'L3', action: 'PACKAGE_NOTIFIED', userId: 'U1', username: 'staff01', detail: 'HK-1003 notification generated.', createdAt: '06 Oct 09:05' },
      { id: 'L4', action: 'EXCEPTION_REPORTED', userId: 'U1', username: 'staff01', detail: 'HK-1004 marked Damaged.', createdAt: '04 Oct 12:00' }
    ],
    config: { siteName: 'Cainiao Post HK', siteCode: 'HK-DEMO', address: '88 Demo Road', phone: '+852 3000 8000', notificationTemplate: 'Hello {{name}}, parcel {{trackingNo}} is ready. Pickup code: {{pickupCode}}.' }
  };
}

function initialState() {
  return {
    ...initialData(),
    currentUser: null,
    route: 'login',
    selectedPackageId: 'P2',
    search: '',
    lastChange: 'Prototype ready.',
    error: ''
  };
}

function nextId(prefix, records) {
  const highest = records.reduce((max, item) => {
    const value = Number(String(item.id || '').replace(/\D/g, ''));
    return Number.isFinite(value) ? Math.max(max, value) : max;
  }, 0);
  return `
  ${prefix}${highest + 1}
  `;
}

function nowLabel() {
  return new Intl.DateTimeFormat('en-GB', { dateStyle: 'medium', timeStyle: 'short', timeZone: 'Asia/Hong_Kong' }).format(new Date());
}

function addLog(state, action, detail) {
  const user = state.currentUser;
  state.logs.push({ id: nextId('L', state.logs), action, userId: user?.id || 'guest', username: user?.username || 'guest', detail, createdAt: nowLabel() });
}

function roleHome(role) {
  if (role === 'staff') return 'staff-dashboard';
  if (role === 'admin') return 'admin-reports';
  return 'customer-packages';
}

function eligibleForException(pkg) {
  return ['Arrived', 'Shelved', 'Notified'].includes(pkg.status);
}

function resolveExceptionState(state, exceptionId) {
  const exception = state.exceptions.find((item) => item.id === exceptionId);
  if (!exception || exception.status !== 'Open') return 'Open exception not found.';
  const pkg = state.packages.find((item) => item.id === exception.packageId);
  if (!pkg) return 'Linked parcel not found.';
  const previous = pkg.previousStatus || 'Arrived';
  let restoredShelf = false;
  if (pkg.shelfId && ['Shelved', 'Notified'].includes(previous)) {
    const shelf = state.shelves.find((item) => item.id === pkg.shelfId);
    if (shelf && shelf.status === 'Active' && shelf.used < shelf.capacity) {
      shelf.used += 1;
      restoredShelf = true;
    }
  }
  if (!restoredShelf) {
    pkg.shelfId = null;
    pkg.pickupCode = null;
    state.notifications = state.notifications.filter((item) => item.packageId !== pkg.id);
  }
  pkg.status = restoredShelf ? previous : 'Arrived';
  delete pkg.previousStatus;
  exception.status = 'Resolved';
  exception.resolvedAt = nowLabel();
  addLog(state, 'EXCEPTION_RESOLVED', `${pkg.trackingNo} resolved.`);
  return `
  Exception resolved. Parcel is now ${pkg.status}.
  `;
}
function reducer(state, action) {
  const next = clone(state);

  switch (action.type) {
    case 'RESET':
      return { ...initialState(), lastChange: 'Prototype reset.' };

    case 'LOGIN': {
      const username = String(action.username || '').trim();
      const user = next.users.find((item) => item.username === username && item.password === String(action.password || ''));
      if (!user) {
        next.error = 'Invalid username or password.';
        next.lastChange = next.error;
        return next;
      }
      next.currentUser = user;
      next.route = roleHome(user.role);
      next.error = '';
      next.lastChange = `${user.name} signed in as ${user.role}.`;
      addLog(next, 'LOGIN', 'User signed in.');
      return next;
    }

    case 'LOGOUT':
      addLog(next, 'LOGOUT', 'User signed out.');
      return { ...clone(initialState()), lastChange: 'Signed out.' };

    case 'NAVIGATE':
      next.route = action.route;
      next.error = '';
      next.lastChange = `Opened ${action.route}.`;
      return next;

    case 'SELECT_PACKAGE':
      next.selectedPackageId = action.packageId;
      next.route = next.currentUser.role === 'customer' ? 'customer-detail' : 'staff-detail';
      next.lastChange = `Selected ${action.packageId}.`;
      return next;

    case 'SET_SEARCH':
      next.search = String(action.search || '').trim();
      next.lastChange = next.search ? `Searching for "${next.search}".` : 'Search cleared.';
      return next;

    case 'CREATE_PACKAGE': {
      const trackingNo = String(action.trackingNo || '').trim().toUpperCase();
      const weight = Number(action.weight);
      if (!trackingNo || !action.recipientName || !action.customerId || !Number.isFinite(weight) || weight <= 0) {
        next.error = 'Complete all parcel fields with a positive weight.';
        next.lastChange = next.error;
        return next;
      }
      if (next.packages.some((item) => item.trackingNo === trackingNo)) {
        next.error = 'Tracking number already exists.';
        next.lastChange = next.error;
        return next;
      }
      const pkg = { id: nextId('P', next.packages), trackingNo, recipientName: action.recipientName, customerId: action.customerId, status: 'Arrived', type: action.type || 'Parcel', weight, shelfId: null, pickupCode: null, arrivedAt: nowLabel(), shelvedAt: null, notifiedAt: null, pickedUpAt: null };
      next.packages.push(pkg);
      addLog(next, 'PACKAGE_CREATED', `${trackingNo} received.`);
      next.route = 'staff-detail';
      next.selectedPackageId = pkg.id;
      next.error = '';
      next.lastChange = `${trackingNo} received.`;
      return next;
    }

    case 'BATCH_CREATE': {
      const lines = String(action.batch || '').split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
      let created = 0;
      const errors = [];
      lines.forEach((line, index) => {
        const [trackingNo, recipientName, weightText, type] = line.split(/[|,]/).map((value) => value.trim());
        const weight = Number(weightText);
        if (!trackingNo || !recipientName || !Number.isFinite(weight) || weight <= 0) {
          errors.push(index + 1);
          return;
        }
        const pkg = { id: nextId('P', next.packages), trackingNo: trackingNo.toUpperCase(), recipientName, customerId: action.customerId, status: 'Arrived', type: type || 'Parcel', weight, shelfId: null, pickupCode: null, arrivedAt: nowLabel(), shelvedAt: null, notifiedAt: null, pickedUpAt: null };
        next.packages.push(pkg);
        created += 1;
      });
      addLog(next, 'PACKAGE_BATCH_CREATED', `${created} parcels batch received.`);
      next.error = errors.length ? `Skipped rows: ${errors.join(', ')}.` : '';
      next.lastChange = `Batch complete: ${created} created.`;
      return next;
    }
    case 'SHELVE': {
      const pkg = next.packages.find((item) => item.id === action.packageId);
      const shelf = next.shelves.find((item) => item.id === action.shelfId);
      if (!pkg || pkg.status !== 'Arrived') { next.error = 'Only Arrived parcels can be shelved.'; next.lastChange = next.error; return next; }
      if (!shelf || shelf.status !== 'Active' || shelf.used >= shelf.capacity) { next.error = 'Select an active shelf with capacity.'; next.lastChange = next.error; return next; }
      pkg.shelfId = shelf.id;
      pkg.pickupCode = String(Math.floor(100000 + Math.random() * 900000));
      pkg.status = 'Shelved';
      pkg.shelvedAt = nowLabel();
      shelf.used += 1;
      addLog(next, 'PACKAGE_SHELVED', `${pkg.trackingNo} placed on ${shelf.code}.`);
      next.lastChange = `${pkg.trackingNo} shelved with code ${pkg.pickupCode}.`;
      next.error = '';
      return next;
    }

    case 'NOTIFY': {
      const pkg = next.packages.find((item) => item.id === action.packageId);
      if (!pkg || pkg.status !== 'Shelved' || !pkg.pickupCode) { next.error = 'Only Shelved parcels with a pickup code can be notified.'; next.lastChange = next.error; return next; }
      pkg.status = 'Notified';
      pkg.notifiedAt = nowLabel();
      const content = next.config.notificationTemplate.replace('{{name}}', pkg.recipientName).replace('{{trackingNo}}', pkg.trackingNo).replace('{{pickupCode}}', pkg.pickupCode);
      next.notifications.push({ id: nextId('N', next.notifications), userId: pkg.customerId, packageId: pkg.id, title: `Parcel ready: ${pkg.trackingNo}`, content, createdAt: nowLabel() });
      addLog(next, 'PACKAGE_NOTIFIED', `${pkg.trackingNo} notification generated.`);
      next.lastChange = `${pkg.trackingNo} notification generated.`;
      next.error = '';
      return next;
    }

    case 'PICKUP': {
      const pkg = next.packages.find((item) => item.id === action.packageId);
      if (!pkg || pkg.status !== 'Notified') { next.error = 'Only Notified parcels can be picked up.'; next.lastChange = next.error; return next; }
      pkg.status = 'Picked Up';
      pkg.pickedUpAt = nowLabel();
      const shelf = next.shelves.find((item) => item.id === pkg.shelfId);
      if (shelf && shelf.used > 0) shelf.used -= 1;
      addLog(next, 'PACKAGE_PICKED_UP', `${pkg.trackingNo} picked up.`);
      next.lastChange = `${pkg.trackingNo} picked up.`;
      next.error = '';
      return next;
    }

    case 'REPORT_EXCEPTION': {
      const pkg = next.packages.find((item) => item.id === action.packageId);
      if (!pkg || !eligibleForException(pkg)) { next.error = 'Parcel cannot enter exception flow.'; next.lastChange = next.error; return next; }
      if (next.exceptions.some((item) => item.packageId === pkg.id && item.status === 'Open')) { next.error = 'Parcel already has an open exception.'; next.lastChange = next.error; return next; }
      pkg.previousStatus = pkg.status;
      pkg.status = 'Exception';
      const shelf = next.shelves.find((item) => item.id === pkg.shelfId);
      if (shelf && shelf.used > 0) shelf.used -= 1;
      next.exceptions.push({ id: nextId('E', next.exceptions), packageId: pkg.id, type: action.exceptionType, description: action.description, status: 'Open', reportedBy: next.currentUser.id, createdAt: nowLabel(), resolvedAt: null });
      addLog(next, 'EXCEPTION_REPORTED', `${pkg.trackingNo}: ${action.exceptionType}.`);
      next.lastChange = `Exception reported for ${pkg.trackingNo}.`;
      next.error = '';
      return next;
    }

    case 'RESOLVE_EXCEPTION': {
      const message = resolveExceptionState(next, action.id);
      if (message.includes('not found')) next.error = message;
      next.lastChange = message;
      return next;
    }

    case 'ADD_SHELF': {
      const code = String(action.code || '').trim().toUpperCase();
      const capacity = Number(action.capacity);
      if (!code || !Number.isInteger(capacity) || capacity < 1) { next.error = 'Shelf needs a code and positive capacity.'; next.lastChange = next.error; return next; }
      if (next.shelves.some((item) => item.code === code)) { next.error = 'Shelf code already exists.'; next.lastChange = next.error; return next; }
      next.shelves.push({ id: nextId('S', next.shelves), code, capacity, used: 0, status: 'Active' });
      addLog(next, 'SHELF_CREATED', `${code} created.`);
      next.lastChange = `Shelf ${code} created.`;
      next.error = '';
      return next;
    }

    case 'TOGGLE_SHELF': {
      const shelf = next.shelves.find((item) => item.id === action.id);
      if (!shelf) return next;
      if (shelf.status === 'Active' && shelf.used > 0) { next.error = 'Occupied shelf cannot enter maintenance.'; next.lastChange = next.error; return next; }
      shelf.status = shelf.status === 'Active' ? 'Maintenance' : 'Active';
      addLog(next, 'SHELF_STATUS_CHANGED', `${shelf.code} is now ${shelf.status}.`);
      next.lastChange = `${shelf.code} is now ${shelf.status}.`;
      next.error = '';
      return next;
    }

    case 'ADD_USER': {
      const username = String(action.username || '').trim().toLowerCase();
      const password = String(action.password || '').trim();
      const name = String(action.name || '').trim();
      const role = action.role;
      if (!username || !password || !name || !['staff', 'admin', 'customer'].includes(role)) { next.error = 'Complete all user fields.'; next.lastChange = next.error; return next; }
      if (next.users.some((item) => item.username === username)) { next.error = 'Username already exists.'; next.lastChange = next.error; return next; }
      next.users.push({ id: nextId('U', next.users), username, password, name, role, phone: action.phone || '—' });
      addLog(next, 'USER_CREATED', `${username} created with role ${role}.`);
      next.lastChange = `User ${username} created.`;
      next.error = '';
      return next;
    }

    case 'SAVE_CONFIG': {
      next.config = { siteName: action.siteName, siteCode: action.siteCode, address: action.address, phone: action.phone, notificationTemplate: action.notificationTemplate };
      addLog(next, 'CONFIG_UPDATED', 'System configuration updated.');
      next.lastChange = 'Configuration saved. The next notification will use the new template.';
      next.error = '';
      return next;
    }

    case 'START_SCENARIO': {
      const reset = initialState();
      if (action.scenario === 'happy') {
        reset.currentUser = reset.users.find((user) => user.username === 'staff01');
        reset.route = 'staff-detail';
        reset.selectedPackageId = 'P2';
        reset.lastChange = 'Happy path ready: notify P2, then complete pickup.';
      } else if (action.scenario === 'illegal') {
        reset.currentUser = reset.users.find((user) => user.username === 'staff01');
        reset.route = 'staff-detail';
        reset.selectedPackageId = 'P1';
        reset.lastChange = 'Illegal transition ready: try to notify an Arrived parcel.';
      } else {
        reset.currentUser = reset.users.find((user) => user.username === 'cust01');
        reset.route = 'customer-packages';
        reset.lastChange = 'Customer isolation ready: cust01 cannot see cust02 parcel P5.';
      }
      return reset;
    }

    default:
      return next;
  }
}

let state = initialState();

function escapeHtml(value) {
  return String(value).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
}

function badge(status) {
  const cls = { Arrived: 'arrived', Shelved: 'shelved', Notified: 'notified', 'Picked Up': 'picked', Exception: 'exception' }[status] || 'shelved';
  return `
  <span class="badge badge-${cls}">${escapeHtml(status)}</span>
  `;
}

function currentParcel() {
  return state.packages.find((pkg) => pkg.id === state.selectedPackageId) || state.packages[0];
}

function visiblePackages() {
  const base = state.currentUser?.role === 'customer' ? state.packages.filter((pkg) => pkg.customerId === state.currentUser.id) : state.packages;
  if (!state.search) return base;
  const query = state.search.toLowerCase();
  return base.filter((pkg) => [pkg.trackingNo, pkg.recipientName, pkg.status, pkg.type].join(' ').toLowerCase().includes(query));
}

function metrics() {
  return {
    total: state.packages.length,
    arrived: state.packages.filter((pkg) => pkg.status === 'Arrived').length,
    notified: state.packages.filter((pkg) => pkg.status === 'Notified').length,
    exceptions: state.packages.filter((pkg) => pkg.status === 'Exception').length,
    used: state.shelves.reduce((sum, shelf) => sum + shelf.used, 0),
    capacity: state.shelves.reduce((sum, shelf) => sum + shelf.capacity, 0)
  };
}

  if (pkg.pickedUpAt) events.push(['Picked Up', pkg.pickedUpAt]);
  if (pkg.status === 'Exception') events.push(['Exception', 'Current exception']);
  return `
  <div class="timeline">${events.map(([label,time]) => `<div class="timeline-item">
  		<div class="dot">
  		</div>
  	<div>
  		<strong>${escapeHtml(label)}</strong>
  		<div class="state-row" style="border:0;padding:0">
  			<span>${escapeHtml(time || '—')}</span>
  		</div>

  `;
}

function renderStaffExceptions() {

function renderPage() {
  if (state.route === 'staff-dashboard') return renderStaffDashboard();
  if (state.route === 'staff-packages') return renderStaffPackages();
  if (state.route === 'staff-create') return renderStaffCreate();
  if (state.route === 'staff-detail') return packageDetail();
  if (state.route === 'staff-shelves') return renderStaffShelves();
  if (state.route === 'staff-exceptions') return renderStaffExceptions();
  if (state.route === 'customer-packages') return renderCustomerPackages();
  if (state.route === 'customer-detail') return renderCustomerDetail();
  if (state.route === 'customer-notifications') return renderCustomerNotifications();
  if (state.route === 'admin-reports') return renderAdminReports();
  if (state.route === 'admin-users') return renderAdminUsers();
  if (state.route === 'admin-logs') return renderAdminLogs();
  if (state.route === 'admin-config') return renderAdminConfig();
  return '<div class="empty">Page not found.</div>';
}

function render() {
  const root = document.querySelector('#app');
  root.innerHTML = state.currentUser ? appShell(renderPage()) : renderLogin();
  if (state.error && state.currentUser && state.route !== 'staff-create') {
    const notice = document.createElement('div');
    notice.className = 'error-box';
    notice.textContent = state.error;
    root.querySelector('.main')?.prepend(notice);
  }
  root.querySelectorAll('.field').forEach((field, index) => {
    const control = field.querySelector('input, select, textarea');
    const label = field.querySelector('label');
    if (!control || !label) return;
    if (!control.id) control.id = `prototype-field-${index}`;
    label.htmlFor = control.id;
  });
}

function showToast(message) {
  const toast = document.querySelector('#toast');
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove('show'), 2300);
}

function dispatch(action) {
  state = reducer(state, action);
  render();
  if (action.type !== 'NAVIGATE' && action.type !== 'SELECT_PACKAGE') {
    showToast(state.error || state.lastChange);
  }
}

const sourceFunctions = {
  renderLogin,
  appShell,
  renderStaffDashboard,
  renderStaffPackages,
  renderStaffCreate,
  packageDetail,
  renderStaffShelves,
  renderStaffExceptions,
  renderCustomerPackages,
  renderCustomerDetail,
  renderCustomerNotifications,
  renderAdminReports,
  renderAdminUsers,
  renderAdminLogs,
  renderAdminConfig,
  renderPage
};

let activeSourceTab = 'renderLogin';

function formatFunctionSource(fn) {
  return fn.toString().replace(/\n{3,}/g, '\n\n');
}

function openSourcePanel(name = activeSourceTab) {
  activeSourceTab = name;
  const panel = document.querySelector('#source-panel');
  const tabs = document.querySelector('#source-tabs');
  const code = document.querySelector('#source-code');
  if (!panel || !tabs || !code) return;
  tabs.innerHTML = Object.keys(sourceFunctions)
    .map((key) => `<button class="source-tab ${key === activeSourceTab ? 'active' : ''}" data-source-tab="${key}">${key}</button>`)
    .join('');
  code.textContent = formatFunctionSource(sourceFunctions[activeSourceTab]);
  panel.classList.add('open');
  panel.setAttribute('aria-hidden', 'false');
}

document.addEventListener('click', (event) => {
  const login = event.target.closest('[data-login-user]');
  if (login) return dispatch({ type: 'LOGIN', username: login.dataset.loginUser, password: '123456' });
  const scenario = event.target.closest('[data-scenario]');
  if (scenario) return dispatch({ type: 'START_SCENARIO', scenario: scenario.dataset.scenario });
  const nav = event.target.closest('[data-nav]');
  if (nav) return dispatch({ type: 'NAVIGATE', route: nav.dataset.nav });
  const select = event.target.closest('[data-select-package]');
  if (select) return dispatch({ type: 'SELECT_PACKAGE', packageId: select.dataset.selectPackage });
  const action = event.target.closest('[data-action]');
  if (action) {
    const type = action.dataset.action;
    const id = action.dataset.id;
    if (type === 'NOTIFY' || type === 'PICKUP') return dispatch({ type, packageId: id });
    return dispatch({ type, id });
  }
  if (event.target.closest('[data-source-toggle]')) return openSourcePanel();
  const tab = event.target.closest('[data-source-tab]');
  if (tab) return openSourcePanel(tab.dataset.sourceTab);
  if (event.target.closest('[data-source-close]')) {
    const panel = document.querySelector('#source-panel');
    panel?.classList.remove('open');
    panel?.setAttribute('aria-hidden', 'true');
    return;
  }
  if (event.target.closest('[data-source-copy]')) {
    const text = document.querySelector('#source-code')?.textContent || '';
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text)
        .then(() => showToast('Function source copied.'))
        .catch(() => showToast('Copy was blocked by the browser.'));
    }
  }
});

document.addEventListener('submit', (event) => {
  event.preventDefault();
  const form = event.target;
  const data = Object.fromEntries(new FormData(form).entries());
  if (form.dataset.form === 'login') return dispatch({ type: 'LOGIN', ...data });
  if (form.dataset.form === 'search-packages') return dispatch({ type: 'SET_SEARCH', search: data.q });
  if (form.dataset.form === 'create-package') return dispatch({ type: 'CREATE_PACKAGE', ...data });
  if (form.dataset.form === 'batch-create') return dispatch({ type: 'BATCH_CREATE', ...data });
  if (form.dataset.form === 'shelve') return dispatch({ type: 'SHELVE', packageId: form.dataset.id, shelfId: data.shelfId });
  if (form.dataset.form === 'add-shelf') return dispatch({ type: 'ADD_SHELF', ...data });
  if (form.dataset.form === 'report-exception') return dispatch({ type: 'REPORT_EXCEPTION', ...data });
  if (form.dataset.form === 'add-user') return dispatch({ type: 'ADD_USER', ...data });
  if (form.dataset.form === 'save-config') return dispatch({ type: 'SAVE_CONFIG', ...data });
});

document.addEventListener('keydown', (event) => {
  if (event.key !== 'Escape') return;
  const panel = document.querySelector('#source-panel');
  panel?.classList.remove('open');
  panel?.setAttribute('aria-hidden', 'true');
});

render();
</script>
</body>
</html>
